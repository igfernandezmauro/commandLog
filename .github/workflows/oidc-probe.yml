name: OIDC Probe

on:
    push:
        branches:
            - feature/cd-development
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    probe:
        name: Verify AWS OIDC
        runs-on: ubuntu-latest
        environment: development

        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6.2.3
              with:
                role-to-assume: arn:aws:iam::280535250460:role/commandlog-dev-github-deploy-role
                aws-region: ca-central-1
                allowed-account-ids: "280535250460"

            - name: Verify AWS identity
              run: aws sts get-caller-identity
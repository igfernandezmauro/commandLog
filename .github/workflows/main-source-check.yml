name: Main Source Check

on:
    pull_request:
        branches:
            - main

jobs:
    require-develop:
        name: Require develop source
        runs-on: ubuntu-latest

        steps:
            - name: Verify source branch
              run: |
                if [[ "${{ github.head_ref }}" != "develop" ]]; then
                    echo "Pull requests to main must come from develop."
                    echo "Source branch: ${{ github.head_ref }}"
                    exit 1
                fi

                echo "Source branch is develop."
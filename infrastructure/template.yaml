AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: CommandLog local development foundation

Resources:
  ListDecksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: commandlog-local-list-decks
      CodeUri: ../backend/
      Handler: functions.list_decks.lambda_function.lambda_handler
      Runtime: python3.11
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 3
      Environment:
        Variables:
          APP_END: local
          AWS_ENDPOINT_URL: http://host.docker.internal:4566
          AWS_REGION: ca-central-1
          STATE_TABLE: commandlog_local_deck_state
          USERS_TABLE: commandlog_local_user_profile

  GetGamesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: commandlog-local-get-games
      CodeUri: ../backend/
      Handler: functions.get_games.lambda_function.lambda_handler
      Runtime: python3.11
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 3
      Environment:
        Variables:
          APP_END: local
          AWS_ENDPOINT_URL: http://host.docker.internal:4566
          AWS_REGION: ca-central-1
          PLAY_EVENTS_TABLE: commandlog_local_play_events

  LogPlayEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: commandlog-local-log-play-event
      CodeUri: ../backend/
      Handler: functions.log_play_event.lambda_function.lambda_handler
      Runtime: python3.11
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 3
      Environment:
        Variables:
          APP_ENV: local
          AWS_ENDPOINT_URL: http://host.docker.internal:4566
          PLAY_EVENTS_TABLE: commandlog_local_play_events
          STATE_TABLE: commandlog_local_deck_state

  StatsSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: commandlog-local-stats-summary
      CodeUri: ../backend/
      Handler: functions.stats_summary.lambda_function.lambda_handler
      Runtime: python3.11
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 3
      Environment:
        Variables:
          APP_ENV: local
          AWS_ENDPOINT_URL: http://host.docker.internal:4566
          PLAY_EVENTS_TABLE: commandlog_local_play_events

  StatsVersionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: commandlog-local-stats-version
      CodeUri: ../backend/
      Handler: functions.stats_version.lambda_function.lambda_handler
      Runtime: python3.11
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 3
      Environment:
        Variables:
          APP_ENV: local
          AWS_ENDPOINT_URL: http://host.docker.internal:4566
          PLAY_EVENTS_TABLE: commandlog_local_play_events

  GetRandomDecksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: commandlog-local-get-random-decks
      CodeUri: ../backend/
      Handler: functions.get_random_decks.lambda_function.lambda_handler
      Runtime: python3.11
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 3
      Environment:
        Variables:
          APP_ENV: local
          AWS_ENDPOINT_URL: http://host.docker.internal:4566
          STATE_TABLE: commandlog_local_deck_state
          PLAY_EVENTS_TABLE: commandlog_local_play_events
          USERS_TABLE: commandlog_local_user_profile

  DeckVersionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: commandlog-local-deck-versions
      CodeUri: ../backend/
      Handler: functions.deck_versions.lambda_function.lambda_handler
      Runtime: python3.11
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 3
      Environment:
        Variables:
          APP_ENV: local
          AWS_ENDPOINT_URL: http://host.docker.internal:4566
          CHANGE_LOG_TABLE: commandlog_local_deck_change_log
          STATE_TABLE: commandlog_local_deck_state

  GetDiffFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: commandlog-local-get-diff
      CodeUri: ../backend/
      Handler: functions.get_diff.lambda_function.lambda_handler
      Runtime: python3.11
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 20
      Environment:
        Variables:
          APP_ENV: local,
          AWS_ENDPOINT_URL: http://host.docker.internal:4566
          CHANGE_LOG_TABLE: commandlog_local_deck_change_log
          DECK_DIFF_TABLE: commandlog_local_deck_diffs
          STATE_TABLE: commandlog_local_deck_state
          CARDS_DIM_TABLE: commandlog_local_cards_dim
          SNAPSHOT_BUCKET: commandlog-local-snapshots
          PRINT_MAP_TABLE: commandlog_local_scryfall_print_map
          EXCLUDED_CATEGORIES: Sideboard,Maybeboard

  SyncDecksFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: commandlog-local-sync-decks
      CodeUri: ../backend/
      Handler: functions.sync_decks.lambda_function.lambda_handler
      Runtime: python3.11
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 120
      Environment:
        Variables:
          APP_ENV: local
          AWS_ENDPOINT_URL: http://host.docker.internal:4566
          STATE_TABLE: commandlog_local_deck_state
          CHANGE_LOG_TABLE: commandlog_local_deck_change_log
          USERS_TABLE: commandlog_local_user_profile
          BUCKET_NAME: commandlog-local-snapshots
          DRY_RUN: "false"
          ARCHIDEKT_FIXTURE_DIR: /var/task/tests/fixtures/archidekt

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: commandlog-local-profile
      CodeUri: ../backend/
      Handler: functions.profile.lambda_function.lambda_handler
      Runtime: python3.11
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 3
      Environment:
        Variables:
          APP_ENV: local
          AWS_ENDPOINT_URL: http://host.docker.internal:4566
          USERS_TABLE: commandlog_local_user_profile
          INGEST_LAMBDA_NAME: commandlog-local-sync-decks
          INVOKE_INGEST_ON_SAVE: "false"
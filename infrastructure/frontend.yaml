AWSTemplateFormatVersion: '2010-09-09'

Description: CommandLog development frontend hosting

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedPattern: '^[a-z0-9-]+$'

  GeneratedBucketName:
    Type: String

  CustomDomainName:
    Type: String
    Default: ""

  CustomDomainCertificateArn:
    Type: String
    Default: ""

  CustomDomainHostedZoneId:
    Type: String
    Default: ""

Conditions:
  HasCustomDomain: !And
    - !Not [!Equals [!Ref CustomDomainName, ""]]
    - !Not [!Equals [!Ref CustomDomainCertificateArn, ""]]
    - !Not [!Equals [!Ref CustomDomainHostedZoneId, ""]]

Resources:
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub commandlog-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}-web

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub commandlog-${EnvironmentName}-frontend
        Description: !Sub CommandLog ${EnvironmentName} S3 origin access
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  GeneratedDataCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub commandlog-${EnvironmentName}-generated-data
        Comment: Short-lived cache for generated CommandLog data
        MinTTL: 0
        DefaultTTL: 300
        MaxTTL: 3600

        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true

          CookiesConfig:
            CookieBehavior: none

          HeadersConfig:
            HeaderBehavior: none

          QueryStringsConfig:
            QueryStringBehavior: none

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub CommandLog ${EnvironmentName} frontend
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100

        Aliases: !If
          - HasCustomDomain
          - - !Ref CustomDomainName
          - !Ref AWS::NoValue

        Origins:
          - Id: WebOrigin
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''

          - Id: GeneratedDataOrigin
            DomainName: !Sub ${GeneratedBucketName}.s3.${AWS::Region}.${AWS::URLSuffix}
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''

        DefaultCacheBehavior:
          TargetOriginId: WebOrigin
          ViewerProtocolPolicy: redirect-to-https

          AllowedMethods:
            - GET
            - HEAD

          CachedMethods:
            - GET
            - HEAD

          Compress: true

          # AWS managed CachingOptimized policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

        CacheBehaviors:
          - PathPattern: data/*
            TargetOriginId: GeneratedDataOrigin
            ViewerProtocolPolicy: redirect-to-https

            AllowedMethods:
              - GET
              - HEAD

            CachedMethods:
              - GET
              - HEAD

            Compress: true
            CachePolicyId: !Ref GeneratedDataCachePolicy

        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref CustomDomainCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  FrontendIPv4Record:
    Condition: HasCustomDomain
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref CustomDomainHostedZoneId
      Name: !Ref CustomDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  FrontendIPv6Record:
    Condition: HasCustomDomain
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref CustomDomainHostedZoneId
      Name: !Ref CustomDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  GeneratedBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref GeneratedBucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${GeneratedBucketName}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  WebBucketName:
    Value: !Ref WebBucket

  DistributionId:
    Value: !Ref Distribution

  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName

  FrontendUrl:
    Value: !If
      - HasCustomDomain
      - !Sub https://${CustomDomainName}
      - !Sub https://${Distribution.DomainName}